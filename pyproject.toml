[project]
name = "expense-tracker-mcp"
version = "0.1.0"
description = "Personal Expense and Income Tracker MCP Server built with FastMCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.2.1",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
